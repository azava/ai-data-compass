name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Scan repository contents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted scanner source
        uses: actions/checkout@v5
        with:
          # PRs use the base revision as the trusted source. Pushes to main
          # and manual runs use the current protected repository revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          path: trusted

      - name: Checkout scan target
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate

      - name: Run metadata-only security scans
        env:
          TRUSTED_ROOT: ${{ github.workspace }}/trusted
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail

          echo "::group::Resolve trusted scanner"
          if [ -x "$TRUSTED_ROOT/.ai-data-compass/skills/security-audit/scripts/security-surface.sh" ]; then
            SCANNER="$TRUSTED_ROOT/.ai-data-compass/skills/security-audit/scripts/security-surface.sh"
          elif [ -x "$TRUSTED_ROOT/.agents/skills/security-audit/scripts/security-surface.sh" ]; then
            SCANNER="$TRUSTED_ROOT/.agents/skills/security-audit/scripts/security-surface.sh"
          else
            echo "Trusted security scanner was not found."
            exit 2
          fi
          echo "Using scanner from the trusted checkout."
          echo "::endgroup::"

          scan_mode() {
            local mode="$1"
            local report="$RUNNER_TEMP/security-${mode}.md"
            echo "::group::Security scan: ${mode}"
            bash "$SCANNER" \
              --root "$CANDIDATE_ROOT" \
              --mode "$mode" \
              --format markdown \
              --fail-on-findings | tee "$report"
            local status=${PIPESTATUS[0]}
            echo "::endgroup::"
            {
              echo "## Security scan: ${mode}"
              cat "$report"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            return "$status"
          }

          set +e
          scan_mode working-tree
          working_status=$?
          scan_mode history
          history_status=$?
          set -e

          if [ "$working_status" -ne 0 ] || [ "$history_status" -ne 0 ]; then
            echo "Security audit failed: review the metadata-only reports above."
            exit 1
          fi

          echo "Security audit passed: no actionable findings were reported."
