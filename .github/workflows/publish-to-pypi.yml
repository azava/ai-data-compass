name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch main history
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main

      - name: Verify release commit is on main
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          main_ref="refs/remotes/origin/main"
          if ! git show-ref --verify --quiet "$main_ref"; then
            echo "::error::Could not resolve origin/main from the release checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$main_ref"; then
            echo "::error::The release tag does not point to a commit contained in main"
            exit 1
          fi

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", actual_tag):
              raise SystemExit("PyPI releases require a stable vMAJOR.MINOR.PATCH tag")
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match {expected_tag!r}"
              )
          PY

      - name: Sync CLI version with project metadata
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]

          version_module = Path("src/ai_data_compass/__init__.py")
          contents = version_module.read_text(encoding="utf-8")
          version_line = re.compile(r'(?m)^(__version__\s*=\s*)"[^"]+"$')
          updated_contents, replacements = version_line.subn(
              lambda match: f'{match.group(1)}"{project_version}"',
              contents,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not safely locate __version__ in the package module")

          version_module.write_text(updated_contents, encoding="utf-8")
          print(f"Building CLI with version {project_version}")
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Save distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/ai-data-compass/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-install:
    name: Verify published PyPI package
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and smoke-test published package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: >-
          python .github/scripts/smoke_test_published_package.py
          --version "${PACKAGE_VERSION#v}"
          --index-url https://pypi.org/simple/
