name: Publish builds to TestPyPI

on:
  push:
    branches:
      - dev
      - homolog

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate development distributions
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.package-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set package version for branch
        id: package-version
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project_file = Path("pyproject.toml")
          contents = project_file.read_text(encoding="utf-8")
          with project_file.open("rb") as file:
              metadata = tomllib.load(file)
          project_version = metadata["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", project_version):
              raise SystemExit(
                  f"Expected a stable MAJOR.MINOR.PATCH project version, got {project_version!r}"
              )

          source_branch = os.environ["SOURCE_BRANCH"]
          if source_branch == "dev":
              package_version = f"{project_version}.dev{os.environ['DEV_BUILD_NUMBER']}"
          elif source_branch == "homolog":
              package_version = project_version
          else:
              raise SystemExit(f"Unsupported TestPyPI source branch: {source_branch!r}")

          version_line = re.compile(r'(?m)^(version\s*=\s*)"[^"]+"$')
          updated_contents, replacements = version_line.subn(
              lambda match: f'{match.group(1)}"{package_version}"',
              contents,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not safely locate project.version in pyproject.toml")

          project_file.write_text(updated_contents, encoding="utf-8")

          version_module = Path("src/ai_data_compass/__init__.py")
          module_contents = version_module.read_text(encoding="utf-8")
          module_version_line = re.compile(r'(?m)^(__version__\s*=\s*)"[^"]+"$')
          updated_module, module_replacements = module_version_line.subn(
              lambda match: f'{match.group(1)}"{package_version}"',
              module_contents,
              count=1,
          )
          if module_replacements != 1:
              raise SystemExit("Could not safely locate __version__ in the package module")
          version_module.write_text(updated_module, encoding="utf-8")

          print(f"Building TestPyPI version {package_version} from {source_branch}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package-version={package_version}\n")
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Save distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/project/ai-data-compass/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-install:
    name: Verify published TestPyPI package
    needs: [build, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and smoke-test published package
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: >-
          python .github/scripts/smoke_test_published_package.py
          --version "$PACKAGE_VERSION"
          --index-url https://test.pypi.org/simple/
          --extra-index-url https://pypi.org/simple/
